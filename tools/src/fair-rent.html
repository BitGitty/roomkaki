<div class="panelbox">
  <label class="fld" for="what">What is being rented?</label>
  <select id="what">
    <option value="common">A common room</option><option value="bed">A bed-space (shared room)</option>
    <option value="master">A master room</option>
    <option value="3-ROOM">Whole 3-room HDB flat</option><option value="4-ROOM">Whole 4-room HDB flat</option>
    <option value="5-ROOM">Whole 5-room HDB flat</option><option value="EXECUTIVE">Whole Executive HDB flat</option>
  </select>
  <label class="fld" for="town">Town</label>
  <select id="town"><option value="">Loading towns…</option></select>
  <label class="fld" for="ask">Asking rent (S$ / month)</label>
  <input id="ask" type="number" min="1" placeholder="e.g. 750" inputmode="numeric">
  <div class="result" id="out" hidden></div>
  <p class="note" id="src">Whole flats are compared with the town's official median rent over the last 12 months (HDB data via
  data.gov.sg, refreshed monthly). Rooms are compared with an estimate made from those official flat rents — real room prices
  vary with the flat, floor and what's included.</p>
</div>
<script>
let MK = null;
const $id = (i) => document.getElementById(i);
const nice = (t) => t.toLowerCase().replace(/(^|[\s/])\w/g, (c) => c.toUpperCase());
fetch("/market/market.json").then((r) => r.json()).then((d) => {
  MK = d;
  $id("town").innerHTML = `<option value="">Choose…</option>` + Object.keys(d.towns).sort()
    .filter((t) => d.towns[t]["4-ROOM"].rent || d.towns[t]["3-ROOM"].rent)
    .map((t) => `<option value="${t}">${nice(t)}</option>`).join("");
  $id("src").innerHTML += ` Data to <b>${d.rent_latest}</b>.`;
});
function verdict(ask, lo, hi) {
  if (ask < lo * 0.7) return ["warn", "Much cheaper than usual", "30%+ below typical can be a scam bait — never pay before viewing in person."];
  if (ask < lo) return ["", "Cheaper than usual", "Good deal if the room is real — check what's included."];
  if (ask <= hi) return ["", "Fair price", "In the usual range for this area."];
  if (ask <= hi * 1.2) return ["mid", "A bit high", "Ask what's included (utilities, aircon, cooking) or try to negotiate."];
  return ["warn", "High for this area", "Well above usual — compare other rooms before agreeing."];
}
function calc() {
  const out = $id("out"), what = $id("what").value, town = $id("town").value, ask = +$id("ask").value;
  if (!MK || !town || !(ask > 0)) { out.hidden = true; return; }
  const row = MK.towns[town];
  let lo, hi, basis;
  if (what.endsWith("ROOM") || what === "EXECUTIVE") {
    const m = row[what].rent;
    if (!m) { out.hidden = false; out.className = "result mid"; out.innerHTML = `<div class="big">Not enough data</div><p>Too few ${what.toLowerCase()} rentals in ${nice(town)} to compare.</p>`; return; }
    lo = m * 0.9; hi = m * 1.1; basis = `official median ${what.toLowerCase()} rent in ${nice(town)}: S$${m.toLocaleString("en")}`;
  } else {
    const m4 = row["4-ROOM"].rent || (row["3-ROOM"].rent ? row["3-ROOM"].rent * 1.15 : null);
    if (!m4) { out.hidden = true; return; }
    const k = { bed: 0.7, common: 1, master: 1.5 }[what];
    lo = Math.round(m4 / 3 * 0.55 * k / 10) * 10; hi = Math.round(m4 / 3 * 0.8 * k / 10) * 10;
    basis = `estimated usual range for this room type in ${nice(town)}`;
  }
  const [cls, label, tip] = verdict(ask, lo, hi);
  out.hidden = false; out.className = "result " + cls;
  out.innerHTML = `<div class="big">${label}</div><p>Usual: <b>S$${Math.round(lo).toLocaleString("en")}–${Math.round(hi).toLocaleString("en")}</b> · ${basis}</p><p class="note">${tip}</p>`;
}
["what", "town", "ask"].forEach((i) => $id(i).addEventListener("input", calc));
</script>
