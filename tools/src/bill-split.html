<div class="panelbox">
  <label class="fld" for="bill">Total bill for the month (S$)</label>
  <input id="bill" type="number" min="0" step="0.01" placeholder="e.g. 240" inputmode="decimal">
  <label class="fld" for="ac">Of that, aircon charged separately? (S$, optional — leave 0 to split everything)</label>
  <input id="ac" type="number" min="0" step="0.01" value="0" inputmode="decimal">
  <label class="fld" for="days">Days in this billing month</label>
  <input id="days" type="number" min="1" max="31" value="30" inputmode="numeric">
  <p class="fld">People (name · days stayed · aircon hours this month)</p>
  <div id="people"></div>
  <button class="ghost noprint" id="add" type="button">+ Add person</button>
  <div class="result" id="out" hidden></div>
  <p class="note">Shared part is split by days stayed; the aircon part (if any) by aircon hours. Agree the method with your
  flatmates in writing first — this just does the maths.</p>
</div>
<script>
const $id = (i) => document.getElementById(i);
let n = 0;
function addPerson(name) {
  n++;
  const d = document.createElement("div");
  d.className = "row2"; d.style.gridTemplateColumns = "2fr 1fr 1fr"; d.style.marginBottom = "6px";
  d.innerHTML = `<input class="pn" placeholder="Name" value="${name || "Person " + n}">
    <input class="pd" type="number" min="0" max="31" placeholder="days" inputmode="numeric">
    <input class="ph" type="number" min="0" placeholder="aircon h" inputmode="numeric">`;
  $id("people").appendChild(d);
  d.querySelectorAll("input").forEach((x) => x.addEventListener("input", calc));
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function calc() {
  const bill = +$id("bill").value, ac = Math.min(+$id("ac").value || 0, bill), days = +$id("days").value || 30;
  const rows = [...$id("people").children].map((r) => ({
    name: r.querySelector(".pn").value || "?", d: r.querySelector(".pd").value === "" ? days : +r.querySelector(".pd").value,
    h: +r.querySelector(".ph").value || 0 }));
  const out = $id("out");
  if (!(bill > 0) || !rows.length) { out.hidden = true; return; }
  const shared = bill - ac, dTot = rows.reduce((s, r) => s + r.d, 0), hTot = rows.reduce((s, r) => s + r.h, 0);
  if (dTot === 0) { out.hidden = true; return; }
  const res = rows.map((r) => ({ ...r, pay: shared * r.d / dTot + (ac > 0 ? (hTot ? ac * r.h / hTot : ac / rows.length) : 0) }));
  out.hidden = false;
  out.innerHTML = `<table class="tt"><tr><th>Who</th><th>Days</th><th>Aircon h</th><th>Pays</th></tr>${res.map((r) =>
    `<tr><td>${esc(r.name)}</td><td>${r.d}</td><td>${r.h}</td><td><b>S$${r.pay.toFixed(2)}</b></td></tr>`).join("")}</table>
    <p class="note">Total S$${res.reduce((s, r) => s + r.pay, 0).toFixed(2)}${ac > 0 && !hTot ? " · no aircon hours given, aircon split equally" : ""}</p>`;
}
["bill", "ac", "days"].forEach((i) => $id(i).addEventListener("input", calc));
$id("add").onclick = () => addPerson();
addPerson("Me"); addPerson();
</script>
