<div class="panelbox">
  <label class="fld" for="pay">Monthly take-home pay (S$, after CPF if any)</label>
  <input id="pay" type="number" min="0" placeholder="e.g. 2500" inputmode="decimal">
  <label class="fld" for="home">Money you send home each month (S$)</label>
  <input id="home" type="number" min="0" value="0" inputmode="decimal">
  <label class="fld" for="other">Other fixed costs (phone, loans, insurance) (S$)</label>
  <input id="other" type="number" min="0" value="0" inputmode="decimal">
  <div class="result" id="out" hidden></div>
  <p class="note">A common budgeting guide is to keep rent around 30% of take-home pay, never above 40%. These are guidelines,
  not official rules. Food and transport estimates are rough averages for a room renter — adjust to your life.</p>
</div>
<script>
const $id = (i) => document.getElementById(i);
const FOOD = 450, TRANSPORT = 120, BILLS = 50;   // rough monthly living costs for a room renter (guide only)
function calc() {
  const pay = +$id("pay").value, out = $id("out");
  if (!(pay > 0)) { out.hidden = true; return; }
  const left = pay - (+$id("home").value || 0) - (+$id("other").value || 0);
  const comfy = Math.min(pay * 0.3, left - FOOD - TRANSPORT - BILLS);
  const max = Math.min(pay * 0.4, left - FOOD - TRANSPORT - BILLS);
  out.hidden = false;
  if (max <= 0) {
    out.className = "result warn";
    out.innerHTML = `<div class="big">Very tight</div><p>After sending money home and basic living costs (~S$${FOOD + TRANSPORT + BILLS}), little is left for rent. Consider a shared bed-space or lower remittance.</p>`;
    return;
  }
  out.className = "result";
  out.innerHTML = `<p>Comfortable rent</p><div class="big">up to S$${Math.max(0, Math.floor(comfy / 10) * 10)}</div>
    <p>Stretch (not more than): <b>S$${Math.floor(max / 10) * 10}</b></p>
    <p class="note">Assumes about S$${FOOD} food, S$${TRANSPORT} transport and S$${BILLS} bills a month. Check what each room really includes with our True monthly cost tool.</p>`;
}
["pay", "home", "other"].forEach((i) => $id(i).addEventListener("input", calc));
</script>
