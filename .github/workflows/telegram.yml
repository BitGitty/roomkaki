name: telegram
# BACKUP runner for room alerts + @roomkaki channel. Primary = the PC task RoomKakiTelegramJob (every 15 min),
# because GitHub ran the old */30 schedule only ~every 10 h on this small repo (watchdog caught it 2026-11-24).
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bot inbox, alerts, channel
        env:
          ROOMKAKI_BOT_TOKEN: ${{ secrets.ROOMKAKI_BOT_TOKEN }}
          ALERTS_JOB_SECRET: ${{ secrets.ALERTS_JOB_SECRET }}
          ROOMKAKI_CHANNEL: "@roomkaki"
        run: python backend/telegram_job.py
